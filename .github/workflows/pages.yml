name: Pages
on:
  push:
    branches: [main, 'arena/**', 'integ/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/kg.py check
      - run: python scripts/gen_docs.py check
      - run: sh web/build.sh
      - run: pytest -q
      - name: Prepara solo i file pubblici
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/ids-kg-site"
          rsync -a --exclude=node_modules --exclude=tests --exclude=scripts --exclude=build.sh --exclude=ARCHITECTURE.md --exclude=.gitignore --exclude='package*.json' web/ "$RUNNER_TEMP/ids-kg-site/"
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with: { path: "${{ runner.temp }}/ids-kg-site" }
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
